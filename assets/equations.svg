<svg viewBox='0 0 1180 360' xmlns='http://www.w3.org/2000/svg'>
<rect x='0' y='0' width='1180' height='360' rx='14' fill='#0d1117'/>
<text x='34' y='44' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='26' font-weight='700' fill='#f2f3f5'>Governing Equations</text>
<rect x='24' y='66' width='1132' height='270' rx='10' fill='none' stroke='#33363c' stroke-width='1.5'/>
<rect x='60' y='96' width='1060' height='210' rx='10' fill='#0f1013' stroke='#3a3f47' stroke-width='1.5'/>
<circle cx='86' cy='118' r='6' fill='#ff5f56'/>
<circle cx='108' cy='118' r='6' fill='#ffbd2e'/>
<circle cx='130' cy='118' r='6' fill='#27c93f'/>
<text x='90' y='151' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#5ee6a0' text-anchor='start'>ΣFₓ = 0</text>
<text x='230' y='151' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>R_Cx − 300 = 0  →  R_Cx = 300 N</text>
<text x='90' y='177' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#4fc3f7' text-anchor='start'>ΣM_C = 0</text>
<text x='230' y='177' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>R_Ay(8) + 300(4) = 0  →  R_Ay = 150 N</text>
<text x='90' y='203' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#2dd4bf' text-anchor='start'>ΣFᵧ = 0</text>
<text x='230' y='203' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>R_Ay + R_Cy = 0  →  R_Cy = 150 N</text>
<text x='90' y='229' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#ffb84d' text-anchor='start'>Joint A</text>
<text x='230' y='229' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>F_AD sin45° = 150  →  F_AD = 212.13 N (T)</text>
<text x='90' y='255' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#ff8a3d' text-anchor='start'>Joint B</text>
<text x='230' y='255' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>F_BC = F_AB → 150 N (T)   |   F_BD = 0 (zero-force)</text>
<text x='90' y='281' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#ff5a5a' text-anchor='start'>Joint C</text>
<text x='230' y='281' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='400' fill='#f2f3f5' text-anchor='start'>F_CD cos45° = F_BC − R_Cx → 212.13 N (C)</text>
</svg>